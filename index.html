// ===== encrypted local storage (AES-256-GCM; key in Android Keystore via SecureStorage, or non-extractable WebCrypto key on web)
let dbp=new Promise(r=>{const q=indexedDB.open('ran_files',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('f'))d.createObjectStore('f');if(!d.objectStoreNames.contains('k'))d.createObjectStore('k')};q.onsuccess=()=>r(q.result)});
const raw=(st,m,...a)=>dbp.then(db=>new Promise((r,j)=>{const q=db.transaction(st,m=='get'?'readonly':'readwrite').objectStore(st)[m](...a);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}));
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY;async function getKey(){if(KEY)return KEY;
 if(NATIVE&&PL.SecureStorage){const SS=PL.SecureStorage;let r=null;try{r=(await SS.internalGetItem({key:'ran.datakey'})).data}catch(e){}
  if(!r){const k=crypto.getRandomValues(new Uint8Array(32));r=b64(k);await SS.internalSetItem({key:'ran.datakey',data:r})}
  KEY=await crypto.subtle.importKey('raw',unb64(r),'AES-GCM',false,['encrypt','decrypt'])}
 else{KEY=await raw('k','get','dk');if(!KEY){KEY=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await raw('k','put',KEY,'dk')}}
 return KEY}
async function enc(buf){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,ct:await crypto.subtle.encrypt({name:'AES-GCM',iv},await getKey(),buf)}}
async function dec(o){return crypto.subtle.decrypt({name:'AES-GCM',iv:o.iv},await getKey(),o.ct)}
const idb=async(m,v,id)=>{if(m=='put'){const e=await enc(await v.arrayBuffer());e.type=v.type;return raw('f','put',e,v===undefined?undefined:id)}
 if(m=='get'){const o=await raw('f','get',v);if(!o)return o;if(o instanceof Blob)return o;return new Blob([await dec(o)],{type:o.type})}return raw('f',m,v,id)};
let svT;function save(){clearTimeout(svT);svT=setTimeout(flush,120);scheduleBackup()}
async function flush(){clearTimeout(svT);const e=await enc(new TextEncoder().encode(JSON.stringify(I)));await raw('f','put',e,'__state');localStorage.removeItem(K)}
addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
async function loadState(){const o=await raw('f','get','__state');if(o&&!(o instanceof Blob)){try{return JSON.parse(new TextDecoder().decode(await dec(o)))}catch(e){console.warn('decrypt failed',e)}}
 const old=localStorage.getItem(K);return old?JSON.parse(old):null}
// ===== Google sign-in + Drive appData backup =====
let gTok=localStorage.gTokExp>Date.now()?sessionStorage.gTok:null,gUser=localStorage.gUser||'',bkT,backing=false;
async function gSignIn(fromOnb){if(!GOOGLE_WEB_CLIENT_ID){toast('Google עדיין לא מוגדר (חסר Client ID) – ממשיך במצב מקומי',1);if(fromOnb)onbDone();return false}
 if(!NATIVE||!PL.SocialLogin){toast('התחברות Google זמינה באפליקציית האנדרואיד',1);if(fromOnb)onbDone();return false}
 try{await PL.SocialLogin.initialize({google:{webClientId:GOOGLE_WEB_CLIENT_ID,mode:'online'}});
  const r=(await PL.SocialLogin.login({provider:'google',options:{scopes:[DRIVE_SCOPE,'email','profile']}})).result;
  gTok=r.accessToken&&r.accessToken.token;sessionStorage.gTok=gTok;localStorage.gTokExp=Date.now()+50*60e3;gUser=(r.profile&&r.profile.email)||'';localStorage.gUser=gUser;localStorage.gOn=1;
  if(fromOnb)onbDone();await restoreIfNeeded();scheduleBackup(1);return true}catch(e){toast('ההתחברות נכשלה',1);return false}}
async function gfetch(url,opt={},retry=1){if(!gTok&&localStorage.gOn)await gSignIn();if(!gTok)throw new Error('no token');
 const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+gTok}});if(r.status==401&&retry){gTok=null;await gSignIn();return gfetch(url,opt,0)}if(!r.ok)throw new Error('drive '+r.status);return r}
const DQ='https://www.googleapis.com/drive/v3/files',DU='https://www.googleapis.com/upload/drive/v3/files';
async function dList(){const r=await gfetch(DQ+'?spaces=appDataFolder&pageSize=1000&fields=files(id,name,modifiedTime)');return (await r.json()).files}
async function dPut(name,blob,existing){const meta=existing?{}:{name,parents:['appDataFolder']},fd=new FormData();fd.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));fd.append('file',blob);
 return gfetch((existing?DU+'/'+existing:DU)+'?uploadType=multipart',{method:existing?'PATCH':'POST',body:fd})}
function scheduleBackup(now){if(!localStorage.gOn)return;clearTimeout(bkT);bkT=setTimeout(backup,now?100:5000)}
async function backup(){if(backing)return scheduleBackup();backing=true;try{const fs=await dList(),by=Object.fromEntries(fs.map(f=>[f.name,f.id]));
 for(const t of I)for(const a of t.att||[])if(!by['att_'+a.id]){const b=await idb('get',a.id);if(b)await dPut('att_'+a.id,b)}
 await dPut('state.json',new Blob([JSON.stringify({v:1,at:Date.now(),items:I})],{type:'application/json'}),by['state.json']);localStorage.lastBk=Date.now()}catch(e){console.warn(e)}backing=false}
async function restoreIfNeeded(){try{const fs=await dList(),st=fs.find(f=>f.name=='state.json');if(!st)return;
 const local=I.some(t=>!/^s\d+$/.test(t.id));if(local&&!confirm('נמצא גיבוי ב-Drive. לשחזר אותו? משימות שקיימות רק במכשיר יישמרו.'))return;
 const d=await (await gfetch(DQ+'/'+st.id+'?alt=media')).json();for(const t of d.items)for(const a of t.att||[]){const f=fs.find(x=>x.name=='att_'+a.id);if(f&&!(await raw('f','get',a.id))){await idb('put',await (await gfetch(DQ+'/'+f.id+'?alt=media')).blob(),a.id)}}
 H.push(JSON.stringify(I));const ids=new Set(d.items.map(t=>t.id));I=[...d.items,...I.filter(t=>!ids.has(t.id)&&!/^s\d+$/.test(t.id))];await flush();draw();toast('שוחזר מ-Drive ✓')}catch(e){toast('שחזור נכשל',1)}}
function gOut(){localStorage.removeItem('gOn');gTok=null;sessionStorage.removeItem('gTok');gUser='';localStorage.removeItem('gUser');try{PL.SocialLogin&&PL.SocialLogin.logout({provider:'google'})}catch(e){}accd.close();toast('התנתקת',1)}
function openAcc(){const on=!!localStorage.gOn;accs.textContent=on?`מחובר${gUser?' כ-'+gUser:''} · גיבוי אחרון: ${localStorage.lastBk?new Date(+localStorage.lastBk).toLocaleString('he-IL'):'עדיין לא'}`:'לא מחובר. הנתונים נשמרים רק במכשיר (מוצפנים).';
 accb.innerHTML=on?'<button class="btn p" onclick="backup().then(()=>{accd.close();toast(\'גובה ✓\',1)})">גבה עכשיו</button><button class="btn" onclick="accd.close();restoreIfNeeded()">שחזר מ-Drive</button><button class="btn d" onclick="gOut()">התנתק</button>':'<button class="btn p" onclick="accd.close();gSignIn()">התחבר עם Google</button>';accd.showModal()}

async function storeBlob(blob,name){const id='a'+Date.now()+Math.random().toString(36).slice(2,6);await idb('put',blob,id);draftAtt.push({id,name,type:blob.type||'application/octet-stream'})}

 const type='image/'+(r.format||'jpeg');await storeBlob(b64blob(r.base64String,type),'photo_'+Date.now()+'.'+(r.format||'jpg'));renderAtts();changed()}catch(e){if(!/cancel/i.test(e.message||''))toast('לא ניתן להוסיף תמונה',1)}}

 return j.features.map(f=>{const p=f.properties,st=[p.street||p.name,p.housenumber].filter(Boolean).join(' '),city=p.city||p.town||p.village||p.county||'';return{label:[st,city].filter(Boolean).join(', '),sub:p.name&&p.street?p.name:'',ll:[f.geometry.coordinates[1],f.geometry.coordinates[0]]}}).filter(x=>x.label).map(x=>{const n=(q.match(/\d+/)||[])[0];if(n&&!/\d/.test(x.label.split(',')[0]))x.label=x.label.replace(/^([^,]+)/,'$1 '+n);return x}).filter((x,i,a)=>a.findIndex(y=>y.label==x.label)==i)}},
 // google:{async suggest(q){/* Places Autocomplete (New) with GOOGLE_PLACES_KEY */}}
};let ADDR_PROVIDER='photon',sugT;
f.address.addEventListener('input',()=>{clearTimeout(sugT);const q=f.address.value.trim();if(q.length<3){sug.classList.remove('on');return}sugT=setTimeout(async()=>{try{const L=await ADDR[ADDR_PROVIDER].suggest(q);if(f.address.value.trim()!==q)return;
 sug.innerHTML=L.map((s,i)=>`<div data-i="${i}">${esc(s.label)}${s.sub?`<small>${esc(s.sub)}</small>`:''}</div>`).join('');sug.classList.toggle('on',L.length>0);sug.querySelectorAll('div').forEach(d=>d.onclick=()=>{const s=L[d.dataset.i];f.address.value=s.label;draftLL=s.ll;sug.classList.remove('on');links();changed()})}catch(e){}},350)});

// ===== pinch to scale UI =====
(function(){let z=+localStorage.uiZ||1,d0=0,z0=1,raf;const set=v=>{z=Math.min(1.6,Math.max(.8,v));if(!raf)raf=requestAnimationFrame(()=>{raf=0;document.documentElement.style.setProperty('--z',z.toFixed(3))})};set(z);

// ---- history / undo
const H=[];function act(label,fn){H.push(JSON.stringify(I));if(H.length>60)H.shift();fn();save();draw();toast(label)}
function undo(){if(!H.length)return;const nx=JSON.parse(H.pop()),ids=new Set(nx.map(t=>t.id));for(const t of I)if(!ids.has(t.id)&&!t.fresh&&(t.name||t.phone||t.address||t.notes||(t.att||[]).length))nx.unshift({...t,prev:t.page=='trash'?t.prev:t.page,page:'trash'});I=nx;save();draw();toast('בוטל',1)}
let tT;function toast(s,noUndo){tmsg.textContent=s;toastEl().querySelector('button').style.display=noUndo||!H.length?'none':'';toastEl().classList.add('on');clearTimeout(tT);const el=toastEl();el.classList.toggle('quick',s=='נשמר');tT=setTimeout(()=>el.classList.remove('on'),s=='נשמר'?1500:3000)}
const toastEl=()=>document.getElementById('toast');
// ---- render
const EI={ran:'☺',gen:'⌂',work:'✦',trash:'♲'},ET={ran:['הדף האישי של רן','דברים שרק שלך. לחץ + להוספה'],gen:['כללי','בית, סידורים, רואה חשבון…'],work:['אין משימות עבודה','מדידות, התקנות, הצעות מחיר – לחץ +'],trash:['הזבל ריק','גרור לכאן משימה כדי למחוק אותה']};
let curPage=2,editId=null,dragging=false;
function card(t){const a=t.att||[],img=a.filter(x=>/^image/.test(x.type)).length,fl=a.length-img;
return `<li class="it${/\?/.test(t.name+t.address)?' unc':''}" data-id="${t.id}"><b>${esc(t.name)}</b><div class="meta">${t.address||t.ll?`<span>${esc(t.address||'מיקום נוכחי')}</span>`:''}${t.phone?`<a href="tel:${esc(t.phone)}" onclick="event.stopPropagation()">${esc(t.phone)}</a>`:''}</div>${t.notes||img||fl||t.ll||t.when?`<div class="ind">${t.when?`<i class="cal">⏰ ${fmtD(t.when.slice(0,10))} · ${t.when.slice(11)}</i>`:''}${t.notes?'<i>📝 הערה</i>':''}${img?`<i>📷 ${img}</i>`:''}${fl?`<i>📎 ${fl}</i>`:''}${t.ll?'<i>📍</i>':''}</div>`:''}</li>`}
function draw(){const s=pages.scrollLeft;pages.innerHTML=P.map(([k])=>{const l=I.filter(t=>t.page==k);return `<section class="page"><ul class="list" data-p="${k}">${l.map(card).join('')}</ul>${l.length?'':`<div class="empty"><div class="ei">${EI[k]}</div><b>${ET[k][0]}</b><span>${ET[k][1]}</span></div>`}</section>`}).join('');pages.scrollLeft=s;
document.querySelectorAll('.list').forEach(el=>Sortable.create(el,{group:'items',animation:250,easing:'cubic-bezier(.2,.8,.2,1)',delay:380,delayOnTouchOnly:true,touchStartThreshold:8,ghostClass:'ghost',chosenClass:'chosen',forceFallback:true,scroll:false,fallbackTolerance:4,
 onStart:()=>{dragging=true;dragX0=lastTX;startPage=curPage;H.push(JSON.stringify(I));navigator.vibrate&&navigator.vibrate(15)},onEnd:e=>{dragging=false;hintEl.classList.remove('on');const tgt=P[curPage][0];
  if(e.to.dataset.p!==tgt){const l=document.querySelector(`.list[data-p="${tgt}"]`);l.insertBefore(e.item,l.firstChild)}const fp=P[startPage][0];
  if(fp===tgt&&e.from===e.to&&e.oldIndex===e.newIndex){H.pop();return}
  syncDom(fp===tgt?'הסדר עודכן':tgt=='trash'?'הועבר לזבל':fp=='trash'?'שוחזר ל'+pn(tgt):'הועבר ל'+pn(tgt))}}));

function syncDom(msg){const o=[];document.querySelectorAll('.list').forEach(l=>l.querySelectorAll('.it').forEach(li=>{const t=byId(li.dataset.id);if(l.dataset.p=='trash'&&t.page!='trash')t.prev=t.page;t.page=l.dataset.p;o.push(t)}));for(const t of I)if(!o.includes(t))o.push(t);I=o;save();setTimeout(draw,0);toast(msg)}
function dt(){const n=Math.round(Math.abs(pages.scrollLeft)/pages.clientWidth);if(!isNaN(n))curPage=n;const c=k=>I.filter(t=>t.page==k).length;
dots.innerHTML=P.map((p,j)=>`<i class="${j==curPage?'on':''}"></i>`).join('');tabs.innerHTML=P.map(([k,n],j)=>`<button class="${j==curPage?'on':''}" onclick="go(${j})">${n}<span>${c(k)}</span></button>`).join('');fab.style.display=curPage==3?'none':'';ttl.textContent=P[curPage][1];undoB.disabled=!H.length}

// long-press drag to screen edge -> flip page (RTL: right edge = previous page)
// long-press drag sideways past ~30% width -> flip to adjacent page (RTL: finger left = next page)
let dragX0=null,startPage=0,lastTX=null;document.addEventListener('touchstart',e=>{lastTX=e.touches[0].clientX},{passive:true,capture:true});const hintEl=document.getElementById('dhint');
function dragMove(x){if(!dragging)return;if(dragX0==null)dragX0=x;const dx=x-dragX0,n=curPage+(dx<0?1:-1),ok=n>=0&&n<P.length,pr=Math.min(1,Math.abs(dx)/(innerWidth*.3));
 if(!ok||Math.abs(dx)<12){hintEl.classList.remove('on');return}hintEl.textContent=(dx<0?'← ':'')+pn(P[n][0])+(dx>0?' →':'');hintEl.classList.add('on');hintEl.style.setProperty('--p',pr);hintEl.classList.toggle('go',pr>=1);
 if(pr>=1){go(n,1);curPage=n;dt();dragX0=x;navigator.vibrate&&navigator.vibrate(20)}}

mvrow.innerHTML=t.fresh?'':P.filter(p=>p[0]!=t.page).map(([k,n])=>`<button type="button" class="${k=='trash'?'tr':''}" onclick="sheetMove('${k}')"><i>${tr?'↶':k=='trash'?'🗑':'→'}</i>${n}</button>`).join('');for(const e of f.elements)if(e.name)e.value=t[e.name]||'';draftAtt=[...(t.att||[])];draftLL=t.ll||null;links();renderAtts();dbox.style.transform='';dlg.showModal();if(t.fresh)setTimeout(()=>f.name.focus(),50)}

function commit(){clearTimeout(saveT);const t=byId(editId);if(!t||!sess||!sess.dirty)return;sess.dirty=0;const d=Object.fromEntries(new FormData(f));Object.assign(t,d,{att:draftAtt,ll:draftLL});
if(t.fresh&&(t.name||t.phone||t.address||t.notes||t.att.length))delete t.fresh;if(!t.fresh&&!sess.pushed){H.push(sess.snap);sess.pushed=true}save();draw();iWA.style.display=iCal.style.display=t.page!='trash'&&!t.fresh?'':'none'}
f.addEventListener('input',changed);
dlg.addEventListener('close',()=>{if(!sess)return;commit();const t=byId(editId);if(t&&t.fresh){I=I.filter(x=>x!==t);save();draw()}else if(sess.pushed)toast('נשמר');sess=null});
function links(){const a=f.address.value.trim(),q=draftLL?draftLL.join(','):a;lw.style.display=lg.style.display=q?'':'none';lw.href=draftLL?`https://waze.com/ul?ll=${q}&navigate=yes`:`https://waze.com/ul?q=${encodeURIComponent(a)}&navigate=yes`;lg.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
f.address.addEventListener('input',()=>{draftLL=null;links()});
function here(){if(!navigator.geolocation)return alert('אין גישה למיקום');navigator.geolocation.getCurrentPosition(p=>{draftLL=[+p.coords.latitude.toFixed(6),+p.coords.longitude.toFixed(6)];if(!f.address.value)f.address.value='מיקום נוכחי';links();changed()},()=>alert('לא ניתן לקבל מיקום'),{enableHighAccuracy:true,timeout:10000})}
async function addAtt(inp){for(const file of inp.files){const id='a'+Date.now()+Math.random().toString(36).slice(2,6);await idb('put',file,id);draftAtt.push({id,name:file.name,type:file.type})}inp.value='';renderAtts();changed()}
async function renderAtts(){atts.innerHTML='';for(const a of draftAtt){const d=document.createElement('div');d.className='att';d.innerHTML=`<button type="button">✕</button>${esc(a.name)}`;d.querySelector('button').onclick=e=>{e.stopPropagation();draftAtt=draftAtt.filter(x=>x!==a);renderAtts();changed()};
const b=await idb('get',a.id);if(b){const u=URL.createObjectURL(b);if(/^image/.test(a.type)){const im=new Image();im.src=u;d.appendChild(im)}d.onclick=()=>open(u,'_blank')}atts.appendChild(d)}}
// swipe-down to close: anywhere on the sheet or backdrop
(function(){let y0=null,x0,dy=0,t0,on=false,tgt;
dlg.addEventListener('touchstart',e=>{const t=e.touches[0];y0=t.clientY;x0=t.clientX;dy=0;on=false;t0=Date.now();tgt=e.target},{passive:true});
dlg.addEventListener('touchmove',e=>{if(y0==null)return;const t=e.touches[0],my=t.clientY-y0,mx=t.clientX-x0;
 if(!on){if(Math.abs(mx)>12&&Math.abs(mx)>Math.abs(my)){y0=null;return}if(my<-6){y0=null;return}if(my<10)return;
  const sc=tgt.closest&&tgt.closest('textarea,.atts');if(sc&&sc.scrollTop>0){y0=null;return}
  on=true;y0=t.clientY;dbox.style.transition='none';if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
 e.preventDefault();dy=Math.max(0,t.clientY-y0);dbox.style.transform=`translateY(${dy}px)`},{passive:false});
dlg.addEventListener('touchend',e=>{if(y0==null||!on){y0=null;return}y0=null;on=false;e.preventDefault();const v=dy/Math.max(1,Date.now()-t0);dbox.style.transition='';
 if(dy>90||v>.5&&dy>30){dbox.style.transition='transform .22s ease-in';dbox.style.transform='translateY(110%)';setTimeout(()=>dlg.close(),200)}else dbox.style.transform=''})})();

// ---- calendar (visual mock)
let calId=null,calDate=null;const iso=d=>d.toISOString().slice(0,10),HM=['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];
const fmtD=s=>{const d=new Date(s+'T00:00'),t=new Date();t.setHours(0,0,0,0);const df=(d-t)/864e5;return df==0?'היום':df==1?'מחר':d.getDate()+' '+HM[d.getMonth()]};
const pad=n=>String(n).padStart(2,'0'),loc=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtW=w=>fmtD(w.slice(0,10))+' '+w.slice(11,16);
function quick(){const n=new Date(),r=[];const add=(l,d)=>r.push([l,loc(d)]);add('בעוד שעה',new Date(+n+36e5));add('בעוד שעתיים',new Date(+n+72e5));
 const ev=new Date(n);ev.setHours(20,0,0,0);if(ev>n)add('הערב 20:00',ev);const tm=new Date(n);tm.setDate(tm.getDate()+1);tm.setHours(9,0,0,0);add('מחר 09:00',tm);const d2=new Date(n);d2.setDate(d2.getDate()+2);d2.setHours(9,0,0,0);add('בעוד יומיים',d2);return r}
function askCal(id){const t=byId(id);if(!t)return;calId=id;cn.textContent=t.name;const q=quick();qr.innerHTML=q.map(([l,w])=>`<button class="dchip" onclick="remSave('${w}')">${l}<small>${fmtW(w)}</small></button>`).join('');
 cdt.value=t.when||q[3][1];cdt.min=loc(new Date());const d=new Date(cdt.value);cd.textContent=d.getDate();remClr.style.display=t.when?'':'none';ensurePerms('notif');cal.showModal()}
function remSave(w){const id=calId;cal.close();if(w&&new Date(w)<=new Date()){toast('בחר זמן עתידי',1);return}
 act(w?'⏰ תזכורת ל'+fmtW(w):'התזכורת הוסרה',()=>{const t=byId(id);if(w)t.when=w;else delete t.when});syncReminders()}
// ===== local notifications
const LN=PL.LocalNotifications,nid=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2000000000+1};
async function syncReminders(){if(!NATIVE||!LN)return;try{const p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))});
 const now=Date.now(),list=I.filter(t=>t.when&&t.page!='trash'&&new Date(t.when)>now).map(t=>({id:nid(t.id),title:'⏰ '+(t.name||'תזכורת'),body:[t.address,t.phone].filter(Boolean).join(' · ')||'הקש לפתיחה',
  schedule:{at:new Date(t.when),allowWhileIdle:true},actionTypeId:'REM',channelId:'rem',extra:{tid:t.id}}));if(list.length)await LN.schedule({notifications:list})}catch(e){console.warn('notif',e)}}
async function initNotifs(){if(!NATIVE||!LN)return;try{await LN.createChannel({id:'rem',name:'תזכורות',importance:5,vibration:true});}catch(e){}
 await LN.registerActionTypes({types:[{id:'REM',actions:[{id:'s10',title:'נודניק 10 דק׳'},{id:'s60',title:'נודניק שעה'},{id:'done',title:'בוצע'}]}]});
 LN.addListener('localNotificationActionPerformed',a=>{const tid=a.notification.extra&&a.notification.extra.tid,t=byId(tid);if(!t)return;
  if(a.actionId=='s10'||a.actionId=='s60'){t.when=loc(new Date(Date.now()+(a.actionId=='s10'?6e5:36e5)));save();draw();syncReminders();toast('נודניק עד '+t.when.slice(11),1)}
  else if(a.actionId=='done'){delete t.when;save();draw();syncReminders();toast('סומן כבוצע',1)}
  else{const j=P.findIndex(p=>p[0]==t.page);go(j,1);setTimeout(()=>edit(tid),300)}});syncReminders()}
// ===== permissions with explanations
const PERM_TXT={notif:['התראות ותזכורות','כדי שתזכורות יקפצו בזמן, גם כשהאפליקציה סגורה.'],camera:['מצלמה','לצילום מראות, מידות ומסמכים לתוך המשימה.'],contacts:['אנשי קשר','כדי למלא טלפון ושם של לקוח בלחיצה.']};
async function ensurePerms(which){if(!NATIVE)return true;const seen=JSON.parse(localStorage.permSeen||'{}');
 try{if(which=='notif'&&LN){let s=await LN.checkPermissions();if(s.display!='granted'){if(!seen.notif&&!await explain('notif'))return false;seen.notif=1;s=await LN.requestPermissions()}
   try{const ex=await LN.checkExactNotificationSetting();if(ex.exact_alarm!='granted'&&!seen.exact){seen.exact=1;localStorage.permSeen=JSON.stringify(seen);if(await explain('notif','לתזכורות מדויקות יש לאשר "שעונים מעוררים ותזכורות" במסך הבא.'))await LN.changeExactNotificationSetting()}}catch(e){}
   localStorage.permSeen=JSON.stringify(seen);return s.display=='granted'}
  if(which=='camera'&&PL.Camera){const s=await PL.Camera.checkPermissions();if(s.camera!='granted'){if(!seen.camera&&!await explain('camera'))return false;seen.camera=1;localStorage.permSeen=JSON.stringify(seen);await PL.Camera.requestPermissions({permissions:['camera','photos']})}return true}
  if(which=='contacts'&&PL.Contacts){const s=await PL.Contacts.checkPermissions();if(s.contacts!='granted'){if(!seen.contacts&&!await explain('contacts'))return false;seen.contacts=1;localStorage.permSeen=JSON.stringify(seen);return (await PL.Contacts.requestPermissions()).contacts=='granted'}return true}}catch(e){console.warn(e)}return true}
function explain(k,extra){return new Promise(r=>{pmt.textContent=PERM_TXT[k][0];pmx.textContent=extra||PERM_TXT[k][1];pmd.showModal();pmok.onclick=()=>{pmd.close();r(true)};pmd.onclose=()=>r(false)})}
async function permsOnboarding(){if(!NATIVE||localStorage.permOnb)return;localStorage.permOnb=1;await ensurePerms('notif')}

function sheetMove(k){const id=editId;dlg.close();mvTo(id,k)}
function restore(){const id=editId,k=byId(id).prev||'work';dlg.close();act('שוחזר ל'+pn(k),()=>{const t=byId(id);t.page=k;I=I.filter(x=>x!==t);I.unshift(t)})}
function delForever(){const t0=byId(editId);if(!t0||t0.page!='trash')return;if(!confirm('למחוק לצמיתות?'))return;const id=editId;dlg.close();act('נמחק לצמיתות',()=>I=I.filter(x=>!(x.id==id&&x.page=='trash')))}
// ---- WhatsApp share
function waText(t){const L=['*'+t.name+'*'];const q=t.ll?t.ll.join(','):t.address;
if(t.address||t.ll)L.push('📍 '+(t.address||'מיקום')+'\n'+'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q));
if(t.phone)L.push('📞 '+t.phone);if(t.when){const d=new Date(t.when);L.push('📅 '+d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})+' בשעה '+t.when.slice(11))}
if(t.notes)L.push('📝 '+t.notes);return L.join('\n\n')}
async function shareWA(id){const t=byId(id),text=waText(t),imgs=(t.att||[]).filter(a=>/^image/.test(a.type));
 if(NATIVE&&PL.Share&&PL.Filesystem){try{const files=[];for(const a of t.att||[]){const b=await idb('get',a.id);if(!b)continue;const d=b64(await b.arrayBuffer()),nm=(a.id+'_'+(a.name||'file')).replace(/[^\w.\-]/g,'_');
   files.push((await PL.Filesystem.writeFile({path:'share/'+nm,data:d,directory:'CACHE',recursive:true})).uri)}
   await PL.Share.share({title:t.name,text,files:files.length?files:undefined,dialogTitle:'שיתוף'});return}catch(e){if(/cancel/i.test(e.message||''))return}}
 if(navigator.share){try{const files=[];for(const a of imgs){const b=await idb('get',a.id);if(b)files.push(new File([b],a.name||'photo.jpg',{type:a.type}))}
  const d={text};if(files.length&&navigator.canShare&&navigator.canShare({files}))d.files=files;await navigator.share(d);return}catch(e){if(e.name=='AbortError')return}}
 open('https://wa.me/?text='+encodeURIComponent(text),'_blank')}
// ---- install prompt (once)
let dp;const standalone=matchMedia('(display-mode: fullscreen),(display-mode: standalone)').matches||navigator.standalone;
function instDone(){inst.style.display='none';localStorage.instShown=1}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!localStorage.instShown&&!standalone){inst.style.display='flex';instB.onclick=()=>{dp.prompt();instDone()}}});
if(/iphone|ipad/i.test(navigator.userAgent)&&!standalone&&!localStorage.instShown){instT.textContent='שיתוף ⬆ ← "הוסף למסך הבית"';instB.style.display='none';inst.style.display='flex'}
(async()=>{I=((await loadState())||SEED()).filter(t=>!/^s\d+$/.test(t.id));I.forEach(t=>{t.att=t.att||[];t.notes=t.notes||''});await flush();draw();go(2,1);initNotifs();if(localStorage.onb)permsOnboarding();
if(!localStorage.onb)onb.style.display='flex';if(localStorage.gOn)scheduleBackup();
if(!NATIVE&&'serviceWorker'in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js')})();
