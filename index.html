<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>המשימות של רן – קריסי</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:system-ui,Arial;background:#f3f4f6}header{background:#b91c1c;color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}nav{display:flex;background:#fff;border-bottom:1px solid #ddd}nav button{flex:1;padding:10px;border:0;background:none;font-size:15px}nav .on{border-bottom:3px solid #b91c1c;font-weight:bold}
#cam{display:block;margin:12px;padding:16px;width:calc(100% - 24px);font-size:18px;background:#111;color:#fff;border:0;border-radius:12px}
.cols{display:flex;gap:8px;overflow-x:auto;padding:8px;scroll-snap-type:x mandatory}.col{min-width:85%;background:#e5e7eb;border-radius:10px;padding:8px;scroll-snap-align:start;min-height:300px}
.col h2{font-size:16px;margin:4px}.card{background:#fff;border-radius:8px;padding:8px;margin:6px 0;box-shadow:0 1px 2px #0002}.card b{display:block}.card small{color:#555;display:block}
.tag{font-size:11px;background:#fee2e2;padding:1px 6px;border-radius:8px}.unc{color:#b45309}.acts button{margin:4px 2px 0 0;font-size:13px}
#map{height:60vh}.hide{display:none}dialog{width:90%;border-radius:12px}input,select,textarea{width:100%;box-sizing:border-box;margin:3px 0 8px;padding:8px;font-size:15px}
.rv{border:1px solid #ccc;border-radius:8px;padding:6px;margin:6px 0}.pad{padding:10px}
</style></head><body>
<header><h1>📋 המשימות של רן</h1><button onclick="edit()">➕ משימה</button></header>
<nav><button id="tb" class="on" onclick="tab('b')">לוח</button><button id="tm" onclick="tab('m')">מפה ומסלול</button></nav>
<div id="vb"><button id="cam" onclick="fi.click()">📷 צלם דף משימות</button><input id="fi" type="file" accept="image/*" capture="environment" class="hide" onchange="ocr(this.files[0])">
<div class="cols" id="cols"></div></div>
<div id="vm" class="hide"><div class="pad"><input id="start" placeholder="נקודת התחלה (למשל: החשמונאים 9, בני ברק)" value="החשמונאים 9, בני ברק"><button onclick="route()">🧭 סדר מסלול</button> <span id="st"></span></div><div id="map"></div><div class="pad" id="rl"></div></div>
<dialog id="dlg"><form method="dialog" id="f"><input name="title" placeholder="משימה" required><select name="type"><option>מדידה</option><option>התקנה</option><option>הצעת מחיר</option><option>בית/סידורים</option><option>אחר</option></select>
<input name="address" placeholder="כתובת"><input name="city" placeholder="עיר" value="בני ברק"><input name="phone" placeholder="טלפון" type="tel"><textarea name="notes" placeholder="הערות"></textarea>
<button value="ok">שמור</button> <button value="x" formnovalidate>ביטול</button></form></dialog>
<dialog id="rev"><h3>משימות שזוהו מהדף</h3><div id="rvl"></div><button onclick="acceptRev()">✅ הוסף ל"מתוכנן"</button> <button onclick="rev.close()">ביטול</button></dialog>
<script>
const COLS=[['todo','מתוכנן'],['doing','בביצוע'],['done','הסתיים']];
// ניתן להגדיר שרת OCR: localStorage.ocrEndpoint = 'https://.../ocr' (POST image -> JSON [{title,type,address,city,phone,notes}])
const SEED=[
["שוקי קרני – הצעת מחיר","הצעת מחיר","","","",""],
["אלי אלפא – חשמל?","אחר","","","","קריאה לא ודאית"],
["ויטל – הרצוג?","מדידה","הרצוג?","","",""],
["איתי (שמריהו?)","אחר","","","",""],
["רוזן?","אחר","","","054-5413230","טלפון מהדף – לבדוק ספרות"],
["ראובן – חרמון?","אחר","חרמון?","","",""],
["רבי עקיבא – אגף/צד?","התקנה","רבי עקיבא?","בני ברק","",""],
["אלחנן? – כיור/אמבטיה?","מדידה","","","052-4299120","קריאה לא ודאית"],
["הוד האוצמן?","אחר","","","",""],
["רשימת בית: דבק, ויטה?, רישום, אבא, כנפה?","בית/סידורים","","","","עמוד 2, צד שמאל"],
["מראה 99×77? – 3300 ₪","הצעת מחיר","רבי ... ?","","052-2301248","עמוד 3: מחיר 3300, מידה 77×99?, '24 ימים?'"],
["רשימת שמות עמוד 1 (≈30 שורות)","אחר","","","","כתב יד קשה מאוד – רמת גן?, גבעת שמואל?, B.S.T – לתמלל עם רן"]
].map((a,i)=>({id:'s'+i,title:a[0],type:a[1],address:a[2],city:a[3],phone:a[4],notes:a[5],status:'todo'}));
let T=JSON.parse(localStorage.tasks||'null')||SEED, cur=null, pend=[], map, lay;
const save=()=>{localStorage.tasks=JSON.stringify(T);draw()};
function draw(){cols.innerHTML=COLS.map(([k,n])=>`<div class="col" ondragover="event.preventDefault()" ondrop="mv(event.dataTransfer.getData('t'),'${k}')"><h2>${n} (${T.filter(t=>t.status==k).length})</h2>${T.filter(t=>t.status==k).map(card).join('')}</div>`).join('')}
function card(t){const i=COLS.findIndex(c=>c[0]==t.status),u=/\?/.test(t.title+t.address)?' unc':'';return `<div class="card" draggable="true" ondragstart="event.dataTransfer.setData('t','${t.id}')"><b class="${u}">${t.title}</b><span class="tag">${t.type}</span><small>📍 ${[t.address,t.city].filter(Boolean).join(', ')||'—'}</small>${t.phone?`<small>📞 <a href="tel:${t.phone}">${t.phone}</a></small>`:''}${t.notes?`<small>${t.notes}</small>`:''}<div class="acts">${i>0?`<button onclick="mv('${t.id}','${COLS[i-1][0]}')">→</button>`:''}${i<2?`<button onclick="mv('${t.id}','${COLS[i+1][0]}')">${COLS[i+1][1]} ←</button>`:''}<button onclick="edit('${t.id}')">✏️</button><button onclick="if(confirm('למחוק?')){T=T.filter(x=>x.id!='${t.id}');save()}">🗑</button></div></div>`}
function mv(id,s){T.find(t=>t.id==id).status=s;save()}
function edit(id){cur=id;const t=T.find(x=>x.id==id)||{};for(const e of f.elements)if(e.name)e.value=t[e.name]||(e.name=='city'&&!id?'בני ברק':'');dlg.showModal()}
dlg.onclose=()=>{if(dlg.returnValue!='ok')return;const d=Object.fromEntries(new FormData(f));if(cur)Object.assign(T.find(t=>t.id==cur),d,{lat:null});else T.push({...d,id:'t'+Date.now(),status:'todo'});save()};
async function ocr(file){if(!file)return;let r;try{if(localStorage.ocrEndpoint){const fd=new FormData();fd.append('image',file);r=await (await fetch(localStorage.ocrEndpoint,{method:'POST',body:fd})).json()}}catch(e){alert('שגיאת OCR')}
if(!r){alert('הדגמה: זיהוי כתב יד עדיין לא מחובר – מוצגות משימות לדוגמה');r=[{title:'מדידת מראה – אמבטיה',type:'מדידה',address:'רבי עקיבא 50',city:'בני ברק',phone:'',notes:''},{title:'הצעת מחיר מקלחון',type:'הצעת מחיר',address:'ז׳בוטינסקי 100',city:'רמת גן',phone:'',notes:''}]}
pend=r;rvl.innerHTML=r.map((t,i)=>`<div class="rv">${['title','address','city','phone'].map(k=>`<input data-i="${i}" data-k="${k}" value="${t[k]||''}" placeholder="${k}">`).join('')}</div>`).join('');rev.showModal();fi.value=''}
function acceptRev(){rvl.querySelectorAll('input').forEach(e=>pend[e.dataset.i][e.dataset.k]=e.value);pend.forEach((t,i)=>T.push({type:'אחר',notes:'',...t,id:'o'+Date.now()+i,status:'todo'}));rev.close();save()}
function tab(v){vb.classList.toggle('hide',v!='b');vm.classList.toggle('hide',v!='m');tb.className=v=='b'?'on':'';tm.className=v=='m'?'on':'';if(v=='m')showMap()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function geo(q){const c=JSON.parse(localStorage.gc||'{}');if(q in c)return c[q];await sleep(1100);const j=await (await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=il&limit=1&q='+encodeURIComponent(q))).json();c[q]=j[0]?[+j[0].lat,+j[0].lon]:null;localStorage.gc=JSON.stringify(c);return c[q]}
async function showMap(){if(!map){map=L.map('map').setView([32.085,34.835],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);lay=L.layerGroup().addTo(map)}setTimeout(()=>map.invalidateSize(),50);lay.clearLayers();
for(const t of T.filter(t=>t.status!='done'&&t.address)){const p=await geo(t.address+', '+(t.city||'')+', ישראל');t.lat=p;if(p)L.marker(p).bindPopup(t.title).addTo(lay)}}
const dist=(a,b)=>Math.hypot(a[0]-b[0],(a[1]-b[1])*Math.cos(a[0]*Math.PI/180));
async function route(){st.textContent='מחשב...';await showMap();let s=await geo(start.value);if(!s){st.textContent='כתובת התחלה לא נמצאה';return}
let left=T.filter(t=>t.status!='done'&&t.lat),o=[],p=s;while(left.length){left.sort((a,b)=>dist(p,a.lat)-dist(p,b.lat));const n=left.shift();o.push(n);p=n.lat}
st.textContent='';const g='https://www.google.com/maps/dir/'+[s,...o.map(t=>t.lat)].map(x=>x.join(',')).join('/');
rl.innerHTML=`<ol>${o.map(t=>`<li>${t.title} – ${t.address} <a href="https://waze.com/ul?ll=${t.lat.join(',')}&navigate=yes">Waze</a></li>`).join('')}</ol><a href="${g}" target="_blank">🗺 פתח מסלול מלא ב-Google Maps</a>`;L.polyline([s,...o.map(t=>t.lat)],{color:'red'}).addTo(lay)}
draw();
</script></body></html>
