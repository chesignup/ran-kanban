name: Android release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: android-actions/setup-android@v3
      - run: npm ci && npm run sync
      - name: Decode keystore
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          test -n "$KS" || { echo "::error::Secret ANDROID_KEYSTORE_B64 is missing"; exit 1; }
          echo "$KS" | base64 -d > $RUNNER_TEMP/release.jks
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build signed APK
        working-directory: android
        env: { ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' }
        run: ./gradlew assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk ../ran-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: 'ran-*.apk' }
